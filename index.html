      if (!owner || !repo) return toast('Isi username dan nama repository', true);
      if (!tok) return toast('Tempel token GitHub Anda', true);
      b.disabled = true; b.textContent = 'Memeriksa…';
      try { await A.github.check(tok, owner, repo); A.github.setToken(tok); d.publish = { owner, repo }; changed(false); draw(true); toast('Terhubung. Sekarang klik "Terbitkan sekarang".'); }
      catch (err) { b.disabled = false; b.textContent = 'Hubungkan'; toast(err.message || 'Gagal terhubung', true); }
      return;
    }
    if (act === 'gh-forget') { A.github.setToken(''); draw(true); return toast('Token dihapus dari browser ini'); }
    if (act === 'gh-publish') {
      const stepEl = el.querySelector('.gh-step'); b.disabled = true; b.textContent = 'Menerbitkan…';
      try {
        const r = await A.github.publish(t => { stepEl.textContent = t; });
        A.github.last = 'Terbit ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + (r.uploaded ? ' · ' + r.uploaded + ' media baru' : '') + '. Website diperbarui dalam ±1 menit (muat ulang dengan Ctrl+F5).';
        status('Sudah diterbitkan ke GitHub'); draw(true); toast('Berhasil diterbitkan');
      } catch (err) { stepEl.textContent = err.message || 'Gagal menerbitkan'; b.disabled = false; b.textContent = 'Coba lagi'; toast(err.message || 'Gagal menerbitkan', true); }
      return;
    }
    if (act === 'reset') { if (b.dataset.sure) { api.replaceData(JSON.parse(JSON.stringify(api.defaults))); changed(true); draw(); toast('Isi dikembalikan ke bawaan'); } else { b.dataset.sure = '1'; b.textContent = 'Klik sekali lagi untuk memastikan'; } return; }
    if (act === 'acc-save') {
      const u = el.querySelector('#acc-user').value.trim(), pw = el.querySelector('#acc-pass').value;
      if (u.length < 3) return toast('Username minimal 3 karakter', true);
      d.admin.user = u; if (pw) { if (pw.length < 8) return toast('Password minimal 8 karakter', true); d.admin.hash = await sha256(d.admin.salt + ':' + pw); }
      changed(false); return toast('Akun disimpan. Publikasikan agar berlaku di website.');
    }
    if (act === 'logout') { if (A.logout) A.logout(); return api.onClose(true); }
  });
  window.addEventListener('beforeunload', e => { if (server && dirty) { e.preventDefault(); e.returnValue = ''; } });

  return {
    open() { isOpen = true; document.documentElement.classList.add('dash-open'); draw(); },
    close() { isOpen = false; document.documentElement.classList.remove('dash-open'); },
    isOpen: () => isOpen
  };
}

/* Dialog login untuk versi statis */
function openLogin(admin) {
  return new Promise(resolve => {
    const w = document.createElement('div'); w.className = 'dash-login'; w.setAttribute('data-noscroll', '');
    w.innerHTML = `<form class="dl-card"><b>Masuk dashboard</b><p>Khusus pemilik website.</p>
      <label><span>Username</span><input name="u" autocomplete="username" required></label>
      <label><span>Password</span><input name="p" type="password" autocomplete="current-password" required></label>
      <p class="dl-err" role="alert"></p><div class="row"><button class="dbtn" type="submit">Masuk</button><button class="dbtn ghost" type="button" data-x>Batal</button></div></form>`;
    document.body.appendChild(w);
    const done = ok => { w.remove(); resolve(ok); };
    w.querySelector('[data-x]').onclick = () => done(false);
    w.querySelector('input').focus();
    let tries = 0;
    w.querySelector('form').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target), err = w.querySelector('.dl-err');
      try {
        const h = await sha256(admin.salt + ':' + f.get('p'));
        if (String(f.get('u')).trim() === admin.user && h === admin.hash) return done(true);
        tries++; err.textContent = 'Username atau password salah.'; if (tries >= 5) { err.textContent = 'Terlalu banyak percobaan. Muat ulang halaman.'; e.target.querySelector('[type=submit]').disabled = true; }
      } catch (ex) { err.textContent = 'Browser ini tidak mendukung login. Buka lewat https atau localhost.'; }
    };
  });
}

/* ============================================================
   github.js — "Terbitkan ke GitHub" untuk versi statis.
   Satu klik: gambar/video baru dipindah ke folder assets/,
   index.html dibangun ulang, lalu semuanya dikirim sebagai
   SATU commit lewat GitHub API. GitHub Pages menayangkan ulang
   otomatis dalam ±1 menit.
   Token disimpan hanya di browser ini (localStorage), tidak
   pernah ikut masuk ke index.html atau repository.
   ============================================================ */

const API = 'https://api.github.com';
const TOKEN_KEY = 'dp-gh-token';

const ghToken = {
  get() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } },
  set(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) { /* mode privat */ } }
};

/* Menebak owner/repo dari alamat situs (namaanda.github.io/repo) */
function guessRepo() {
  try {
    const h = location.hostname, m = /^([a-z0-9-]+)\.github\.io$/i.exec(h);
    if (!m) return null;
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return { owner: m[1], repo: seg && !/\.html?$/i.test(seg) ? seg : m[1] + '.github.io' };
  } catch (e) { return null; }
}

async function gh(token, method, path, body) {
  const r = await fetch(API + path, {
    method,
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const j = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) {
    const msg = r.status === 401 ? 'Token tidak valid atau sudah kedaluwarsa.'
      : r.status === 403 ? 'Token tidak punya izin "Contents: Read and write" untuk repository ini.'
      : r.status === 404 ? 'Repository tidak ditemukan, atau token tidak diberi akses ke repository ini.'
      : r.status === 422 ? 'GitHub menolak data: ' + (j.message || '')
      : (j.message || 'GitHub error ' + r.status);
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return j;
}

async function checkRepo(token, owner, repo) {
  const j = await gh(token, 'GET', `/repos/${owner}/${repo}`);
  if (j.permissions && !j.permissions.push) throw new Error('Token hanya bisa membaca. Beri izin "Contents: Read and write".');
  return { branch: j.default_branch || 'main', private: !!j.private, url: j.html_url };
}

/* data:image/webp;base64,... -> { mime, ext, b64 } */
function parseDataUrl(u) {
  const m = /^data:([\w/+.-]+);base64,(.+)$/s.exec(u);
  if (!m) return null;
  const ext = { 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/svg+xml': 'svg', 'image/avif': 'avif', 'video/mp4': 'mp4', 'video/webm': 'webm' }[m[1]];
  return ext ? { mime: m[1], ext, b64: m[2] } : null;
}
async function shortHash(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
}
function utf8ToB64(s) {
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* Memindahkan semua data URI (gambar/video yang diunggah di dashboard) ke file assets/ */
async function extractAssets(data) {
  const files = [];
  const seen = new Map();
  async function walk(o) {
    if (Array.isArray(o)) { for (let i = 0; i < o.length; i++) o[i] = await visit(o[i]); return; }
    if (o && typeof o === 'object') for (const k of Object.keys(o)) { if (k === 'admin') continue; o[k] = await visit(o[k]); }
  }
  async function visit(v) {
    if (typeof v === 'string' && v.startsWith('data:')) {
      const p = parseDataUrl(v); if (!p) return v;
      if (seen.has(v)) return seen.get(v);
      const path = 'assets/' + (await shortHash(p.b64)) + '.' + p.ext;
      files.push({ path, b64: p.b64 }); seen.set(v, path); return path;
    }
    if (v && typeof v === 'object') await walk(v);
    return v;
  }
  await walk(data);
  return files;
}

/**
 * Menerbitkan situs. data = isi situs (akan diubah: data URI -> path assets/).
 * buildHtml(data) -> string index.html.  onStep(text) untuk progres.
 */
async function publishToGitHub({ token, owner, repo, branch, data, buildHtml, onStep }) {
  const step = onStep || (() => {});
  step('Memeriksa repository…');
  const info = await checkRepo(token, owner, repo);
  branch = branch || info.branch;

  step('Menyiapkan gambar & video…');
  const assets = await extractAssets(data);
  data._build = Date.now();
  const html = buildHtml(data);

  let parent = null, baseTree = null;
  try {
    const ref = await gh(token, 'GET', `/repos/${owner}/${repo}/git/ref/heads/${branch}`);
    parent = ref.object.sha;
    baseTree = (await gh(token, 'GET', `/repos/${owner}/${repo}/git/commits/${parent}`)).tree.sha;
  } catch (e) {
    if (e.status !== 404 && e.status !== 409) throw e;
    // Repository masih kosong: buat commit pertama lewat Contents API
    step('Repository kosong, membuat commit pertama…');
    await gh(token, 'PUT', `/repos/${owner}/${repo}/contents/.nojekyll`, { message: 'Inisialisasi GitHub Pages', content: '', branch });
    return publishToGitHub({ token, owner, repo, branch, data, buildHtml: () => html, onStep });
  }

  // Lewati aset yang sudah ada di repository (nama file = hash isinya)
  let existing = new Set();
  try {
    const tree = await gh(token, 'GET', `/repos/${owner}/${repo}/git/trees/${baseTree}?recursive=1`);
    existing = new Set((tree.tree || []).map(t => t.path));
  } catch (e) { /* tidak fatal */ }
  const fresh = assets.filter(a => !existing.has(a.path));

  const entries = [];
  let n = 0;
  for (const a of fresh) {
    n++; step(`Mengunggah media ${n}/${fresh.length}…`);
    const blob = await gh(token, 'POST', `/repos/${owner}/${repo}/git/blobs`, { content: a.b64, encoding: 'base64' });
    entries.push({ path: a.path, mode: '100644', type: 'blob', sha: blob.sha });
  }
  step('Mengunggah index.html…');
  const htmlBlob = await gh(token, 'POST', `/repos/${owner}/${repo}/git/blobs`, { content: utf8ToB64(html), encoding: 'base64' });
  entries.push({ path: 'index.html', mode: '100644', type: 'blob', sha: htmlBlob.sha });
  if (!existing.has('.nojekyll')) {
    const nj = await gh(token, 'POST', `/repos/${owner}/${repo}/git/blobs`, { content: '', encoding: 'utf-8' });
    entries.push({ path: '.nojekyll', mode: '100644', type: 'blob', sha: nj.sha });
  }

  step('Menyimpan perubahan…');
  const tree = await gh(token, 'POST', `/repos/${owner}/${repo}/git/trees`, { base_tree: baseTree, tree: entries });
  const stamp = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
  const commit = await gh(token, 'POST', `/repos/${owner}/${repo}/git/commits`, { message: 'Update portofolio dari dashboard · ' + stamp, tree: tree.sha, parents: [parent] });
  await gh(token, 'PATCH', `/repos/${owner}/${repo}/git/refs/heads/${branch}`, { sha: commit.sha });

  return { commit: commit.sha, uploaded: fresh.length, url: `https://github.com/${owner}/${repo}/commit/${commit.sha}` };
}

/* Status build GitHub Pages terakhir (untuk info "sudah tayang") */
async function pagesStatus(token, owner, repo) {
  try { const j = await gh(token, 'GET', `/repos/${owner}/${repo}/pages/builds/latest`); return j.status; } catch (e) { return ''; }
}

/* ============================================================
   app.js — pembungkus versi STATIS: memuat data, draft lokal
   (IndexedDB), tema, bahasa, login ringan, dan export HTML.
   ============================================================ */





(async function boot() {
  const html = document.documentElement, app = document.getElementById('app');
  const baked = JSON.parse(document.getElementById('site-data').textContent);
  const defaults = JSON.parse(JSON.stringify(baked));
  let data = baked, base = baked._build || 0;

  const idb = {
    open: () => new Promise((res, rej) => { try { const r = indexedDB.open('dp-portfolio', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }),
    async get(k) { try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; } },
    async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  };
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

  const draft = await Promise.race([idb.get('draft'), new Promise(r => setTimeout(() => r(null), 800))]);
  if (draft && draft.data && draft.base >= base) { data = draft.data; base = draft.base; }

  let params; try { params = new URLSearchParams(location.search); } catch (e) { params = new URLSearchParams(); }
  let lang = params.get('lang') || ls.get('dp-lang') || 'id';
  const forName = (params.get('for') || '').slice(0, 60);
  if (params.has('behance') || location.hash === '#behance') html.classList.add('behance');

  let destroy = null, first = true, editing = false, dash = null, rt = 0;
  function applyTheme() {
    document.getElementById('theme-vars').textContent = themeVars(data.theme);
    const l = document.getElementById('site-fonts'), h = fontHref(data.theme); if (l && l.getAttribute('href') !== h) l.setAttribute('href', h);
    document.title = data.meta.title || data.brand.name; html.lang = lang;
  }
  function render() {
    const y = window.scrollY; if (destroy) destroy(); applyTheme();
    app.innerHTML = renderSite(data, { lang, forName, noLoader: !first });
    destroy = initSite(app, { data, lang, still: editing, firstLoad: first, onLang: l => { lang = l; ls.set('dp-lang', l); render(); }, onAdmin: openAdmin });
    first = false; if (y) window.scrollTo(0, y);
  }
  async function openAdmin() {
    if (dash && dash.isOpen()) return;
    if (ss.get('dp-admin') !== '1') { const ok = await openLogin(data.admin); if (!ok) return; ss.set('dp-admin', '1'); }
    if (!dash) dash = initDashboard({
      defaults, getData: () => data,
      replaceData: d => { d.admin = d.admin || data.admin; data = d; },
      onChange: () => { clearTimeout(rt); rt = setTimeout(render, 220); },
      onClose: () => { editing = false; dash.close(); render(); },
      focusSection: id => { const s = document.getElementById(id); if (s) window.scrollTo(0, s.getBoundingClientRect().top + window.scrollY - 10); },
      behance: () => { html.classList.add('behance'); render(); const b = document.createElement('button'); b.className = 'behance-exit'; b.textContent = 'Keluar mode Behance'; b.onclick = () => { html.classList.remove('behance'); b.remove(); render(); }; document.body.appendChild(b); },
      adapter: {
        mode: 'static',
        save: d => idb.set('draft', { base, data: d }),
        uploadImage: f => compressImage(f),
        uploadFile: f => new Promise((res, rej) => {
          if (!/^video\/(mp4|webm)$/.test(f.type)) return rej(new Error('Gunakan video MP4 atau WebM'));
          if (f.size > 25e6) return rej(new Error('Video maks 25 MB. Untuk video lebih besar, unggah ke YouTube/Vimeo lalu tempel link-nya.'));
          const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Video tidak bisa dibaca')); fr.readAsDataURL(f);
        }),
        github: {
          last: '',
          getToken: () => ghToken.get(), setToken: t => ghToken.set(t), guess: () => guessRepo(),
          check: (t, o, r) => checkRepo(t, o, r),
          async publish(onStep) {
            const pub = data.publish || {}, token = ghToken.get();
            if (!token || !pub.owner || !pub.repo) throw new Error('Hubungkan GitHub terlebih dahulu');
            const clone = JSON.parse(JSON.stringify(data));
            const css = document.getElementById('site-css').textContent, js = document.getElementById('site-js').textContent;
            const r = await publishToGitHub({ token, owner: pub.owner, repo: pub.repo, data: clone, onStep, buildHtml: d => pageShell(d, css, js) });
            base = clone._build; data._build = clone._build;          // draft lokal tetap menyimpan versi lengkap
            await idb.set('draft', { base, data }).catch(() => {});
            return r;
          }
        },
        logout: () => ss.set('dp-admin', null),
        exportHtml: d => {
          base = Date.now(); d._build = base; idb.set('draft', { base, data: d }).catch(() => {});
          return pageShell(d, document.getElementById('site-css').textContent, document.getElementById('site-js').textContent);
        }
      }
    });
    editing = true; render(); dash.open();
  }
  render();
  if (location.hash === '#admin') openAdmin();
})();

})();</script></body></html>
